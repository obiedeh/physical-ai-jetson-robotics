name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vision]"

      - name: Lint
        run: ruff check physical_ai_lab arm_control edge_ai slam agents synria_lerobot isaac/isaaclab_tasks tests scripts/check_repo_hygiene.py

      - name: Type check
        run: mypy physical_ai_lab arm_control edge_ai slam synria_lerobot isaac/isaaclab_tasks --ignore-missing-imports

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Test
        timeout-minutes: 10
        run: python -u -X faulthandler -m pytest -vv -o faulthandler_timeout=60 --durations=20

  synria-cpu-acceptance:
    name: Synria CPU acceptance on released LeRobot 0.6.1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      WANDB_MODE: disabled
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install CPU recording and training dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 torchcodec==0.11.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,vision,robot-learning]' 'lerobot[training]==0.6.1'
          python -m pip check
      - name: Verify the released CPU environment
        run: |
          python -c "from importlib.metadata import version; import torch; assert version('lerobot') == '0.6.1'; assert torch.version.cuda is None; print('LeRobot', version('lerobot'), 'CPU tensor runtime', torch.__version__)"
      - name: Record, train, serve and evaluate with fake devices
        timeout-minutes: 10
        run: >-
          python -u -X faulthandler -m pytest -vv
          -o faulthandler_timeout=60 --durations=20
          tests/test_lerobot_dataset_writer.py
          tests/test_checkpoint_eval_lerobot.py
          tests/test_synria_act_training_real.py
          tests/test_synria_roll_acceptance_real.py

  ros2-lint:
    name: ROS 2 description package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install colcon
        run: pip install colcon-common-extensions

      # Vendor geometry/packages are obtained separately; this validates wrapper builds.
      - name: Build first-party ROS 2 packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select \
            rosmaster_m3pro_description \
            rosmaster_m3pro_control \
            rosmaster_m3pro_bringup \
            synria_arm_description \
            synria_arm_bringup \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        working-directory: ros2_ws
        shell: bash
