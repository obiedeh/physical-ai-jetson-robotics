name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check physical_ai_lab arm_control edge_ai slam agents lerobot isaac/isaaclab_tasks tests

      - name: Type check
        run: mypy physical_ai_lab arm_control edge_ai slam lerobot isaac/isaaclab_tasks --ignore-missing-imports

      - name: Test
        run: pytest -q

  ros2-lint:
    name: ROS 2 description package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install colcon
        run: pip install colcon-common-extensions

      # Vendor geometry/packages are obtained separately; this validates wrapper builds.
      - name: Build first-party ROS 2 packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select \
            rosmaster_m3pro_description \
            rosmaster_m3pro_control \
            rosmaster_m3pro_bringup \
            synria_arm_description \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        working-directory: ros2_ws
        shell: bash
