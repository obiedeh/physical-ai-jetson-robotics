name: Command agent hermetic gates

on:
  push:
    branches: ["command-agent"]
  pull_request:
    paths:
      - "agents/command_agent/**"
      - "tests/test_command_agent*.py"
      - "physical_ai_lab/cli.py"
      - "pyproject.toml"
      - ".github/workflows/command-agent.yml"
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install core and test tools without provider or robot extras
        run: python -m pip install -e . pytest ruff mypy
      - name: Lint command agent
        run: ruff check agents/command_agent tests/test_command_agent.py tests/test_command_agent_campaign.py
      - name: Type check command agent
        run: mypy agents/command_agent --follow-imports=silent
      - name: Exercise all gates with injected clients and simulators
        run: python -m pytest tests/test_command_agent.py tests/test_command_agent_campaign.py -q
